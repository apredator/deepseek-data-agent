name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # matplotlib/seaborn are heavy and only needed by the legacy agent;
          # install the rest for the HR agent + API + tests.
          pip install requests pandas numpy python-dotenv pytest
          pip install fastapi uvicorn httpx streamlit

      - name: Show tool catalogue
        run: python main.py hr --tools

      - name: Deterministic audit (must find 100% of injected anomalies)
        run: |
          python generate_synthetic_dataset.py --employees 300 --quiet
          python main.py hr --audit

      - name: Run test suite
        run: pytest -q
